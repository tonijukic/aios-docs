<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga Manager - Ljubljanska teniška liga (prototip)</title>
<style>
  :root{
    --clay:#c1572f; --clay-d:#a5471f; --clay-l:#e8825a;
    --green:#2f9e44; --green-l:#e7f6ec; --green-d:#1e7a30;
    --ink:#20262e; --muted:#6b7684; --line:#e6e4df;
    --bg:#f6f3ee; --card:#ffffff; --amber:#e8a32c; --amber-l:#fdf3df;
    --red:#d64545; --red-l:#fbe9e9; --blue:#3b7ddd; --blue-l:#e9f1fc;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--clay-d)}
  /* top bar */
  header{background:linear-gradient(120deg,var(--clay),var(--clay-d));color:#fff;
    padding:0 20px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .topin{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:16px;height:60px}
  .logo{font-weight:800;font-size:18px;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
  .ball{width:22px;height:22px;border-radius:50%;background:#d8f500;position:relative;flex:0 0 auto;
    box-shadow:inset -3px -3px 0 rgba(0,0,0,.08)}
  .ball::before,.ball::after{content:"";position:absolute;inset:0;border-radius:50%;
    border:2px solid #fff;clip-path:inset(0 0 50% 0);transform:rotate(0)}
  .ball::after{clip-path:inset(50% 0 0 0)}
  .spacer{flex:1}
  .who{display:flex;align-items:center;gap:8px;font-size:13.5px}
  .who select{border:none;border-radius:8px;padding:7px 10px;font-size:13.5px;font-weight:600;
    background:rgba(255,255,255,.16);color:#fff;cursor:pointer}
  .who select option{color:#000}
  .badge-role{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
  /* layout */
  .shell{max-width:1160px;margin:0 auto;display:flex;gap:22px;padding:22px 20px 60px}
  nav{flex:0 0 206px;position:sticky;top:82px;align-self:flex-start}
  nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;
    background:none;padding:10px 13px;border-radius:10px;font-size:14.5px;color:var(--ink);
    cursor:pointer;font-weight:600;margin-bottom:2px}
  nav button .ic{width:18px;text-align:center;opacity:.7}
  nav button.active{background:var(--clay);color:#fff}
  nav button.active .ic{opacity:1}
  nav button:not(.active):hover{background:#efe9e1}
  nav .count{margin-left:auto;background:var(--amber);color:#fff;border-radius:999px;
    font-size:11px;padding:1px 7px;font-weight:800}
  nav button.active .count{background:rgba(255,255,255,.25)}
  main{flex:1;min-width:0}
  /* cards & generic */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .card + .card{margin-top:16px}
  h1{font-size:24px;margin:0 0 3px;letter-spacing:-.4px}
  .lead{color:var(--muted);margin:0 0 20px;font-size:14px}
  h2{font-size:16px;margin:0 0 14px}
  h3{font-size:14px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .kpi{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px}
  .kpi .n{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
  .kpi .l{color:var(--muted);font-size:13px;margin-top:5px}
  .kpi.good .n{color:var(--green)} .kpi.warn .n{color:var(--amber)} .kpi.bad .n{color:var(--red)}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;
    font-size:12px;font-weight:700;white-space:nowrap}
  .p-green{background:var(--green-l);color:var(--green-d)}
  .p-amber{background:var(--amber-l);color:#9a6a0f}
  .p-red{background:var(--red-l);color:#b23333}
  .p-blue{background:var(--blue-l);color:#2a5fb0}
  .p-gray{background:#eee;color:#666}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:center}
  .btn{border:none;border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--clay);color:#fff}
  .btn.primary:hover{background:var(--clay-d)}
  .btn.ok{background:var(--green);color:#fff}
  .btn.ghost{background:#f0ece6;color:var(--ink)}
  .btn.danger{background:var(--red-l);color:var(--red)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .muted{color:var(--muted)}
  .bar{height:9px;border-radius:999px;background:#eceae5;overflow:hidden}
  .bar > span{display:block;height:100%;background:var(--green)}
  /* match cards */
  .matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .match{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;position:relative}
  .match.confirmed{border-color:var(--green);background:var(--green-l)}
  .match.forfeit{border-color:var(--red);background:var(--red-l);opacity:.85}
  .match .slot{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
  .vs{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
  .pl{display:flex;flex-direction:column;gap:3px;flex:1}
  .pl .nm{font-weight:700}
  .pl.me .nm{color:var(--clay-d)}
  .vs .x{font-weight:800;color:var(--muted)}
  .chip-conf{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;align-self:flex-start}
  .c-yes{background:var(--green);color:#fff}
  .c-wait{background:#ece9e4;color:#888}
  .c-no{background:var(--red);color:#fff}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .lg-tag{display:inline-block;background:#f0ece6;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;color:var(--muted)}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
  .sec-head h2{margin:0}
  .avgrid{display:grid;grid-template-columns:140px repeat(6,1fr);gap:6px;font-size:13px;align-items:center}
  .avgrid .hd{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}
  .slotbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 4px;cursor:pointer;
    font-size:12.5px;font-weight:600;text-align:center;color:var(--muted)}
  .slotbtn.on{background:var(--green);color:#fff;border-color:var(--green)}
  .notice{background:var(--amber-l);border:1px solid #f0d79a;border-radius:10px;padding:12px 14px;
    font-size:13.5px;color:#8a5e10;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
  .avail-card{border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;
    align-items:center;gap:12px;background:#fff;margin-bottom:10px}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--clay-l);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto;font-size:14px}
  .flash{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:200;opacity:0;
    transition:opacity .25s, transform .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .flash.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .proto-tag{background:#20262e;color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;
    padding:2px 7px;letter-spacing:.06em}
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filterbar select,.filterbar input{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13.5px;background:#fff}
  .foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:30px;line-height:1.7}
  .hidden{display:none!important}
  .tabhint{font-size:12.5px;color:var(--muted);margin:-8px 0 16px}
  details.help{margin-top:16px;border:1px dashed var(--line);border-radius:10px;padding:0 14px;background:#fbfaf7}
  details.help summary{cursor:pointer;font-weight:700;padding:12px 0;font-size:13.5px}
  details.help div{padding:0 0 14px;font-size:13.5px;color:#4a525c}
  @media(max-width:860px){
    .shell{flex-direction:column}
    nav{position:static;flex:none;display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
    .avgrid{grid-template-columns:90px repeat(6,1fr);font-size:11px}
  }
</style>
</head>
<body>

<header>
  <div class="topin">
    <div class="logo"><span class="ball"></span> Liga Manager <span class="proto-tag">PROTOTIP</span></div>
    <div class="spacer"></div>
    <div class="who">
      <span>Prijavljen kot:</span>
      <select id="userSel" onchange="setUser(this.value)"></select>
      <span class="badge-role" id="roleBadge">admin</span>
    </div>
  </div>
</header>

<div class="shell">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div class="flash" id="flash"></div>

<script>
/* =========================================================================
   LIGA MANAGER - prototip za Ljubljansko teniško ligo
   Statičen demo. Vsi podatki so izmišljeni (razen koncepta procesa).
   Stanje se shranjuje v localStorage (reset: gumb spodaj v nogi).
   ========================================================================= */

const WEEKEND = "30. 10. - 1. 11. 2026";
const LEAGUES = ["1. liga","2. liga","3. liga","4. A liga","4. B liga"];
const DAYS = ["Pet 30.10","Sob 31.10","Ned 1.11"];
const TIMES = ["dop (9-13)","pop (13-17)","vecer (17-21)"];
const SLOT_LABELS = []; DAYS.forEach(d=>TIMES.forEach(t=>SLOT_LABELS.push(d+" "+t)));

/* ---- demo seed (izmišljeni igralci) ---- */
const SEED = {
  players: [
    // 4. A liga (Tonijeva liga)
    mk("Toni Jukic","4. A liga","031 392 921","toni.jukic@gmail.com","toni_vv","polznica","cakanje",true),
    mk("Filip Dolenc","4. A liga","041 221 530","filip.d@example.com","filipd","lokacija","placano",false),
    mk("Jure Trupej","4. A liga","040 118 220","jure.t@example.com","juret","polznica","placano",true),
    mk("Rok Salamija","4. A liga","051 667 110","rok.s@example.com","roks","polznica","zapadlo",false),
    mk("Gal Novak","4. A liga","031 540 221","gal.n@example.com","galn","lokacija","cakanje",true),
    mk("Andraz Starc","4. A liga","041 770 330","andraz.s@example.com","andrazs","polznica","placano",false),
    // 1. liga
    mk("Luka Cernuta","1. liga","031 110 220","luka.c@example.com","lukac","polznica","placano",true),
    mk("Uros Samec","1. liga","040 330 110","uros.s@example.com","uross","polznica","placano",false),
    mk("Danijel Josic","1. liga","051 220 440","danijel.j@example.com","danijelj","lokacija","cakanje",true),
    mk("Jan Hocevar","1. liga","031 880 110","jan.h@example.com","janh","polznica","placano",false),
    // 2. liga
    mk("Ziga Pucko","2. liga","040 551 220","ziga.p@example.com","zigap","polznica","cakanje",true),
    mk("Klemen Lahovec","2. liga","041 220 990","klemen.l@example.com","klemenl","lokacija","placano",false),
    mk("Marko Rabuza","2. liga","031 660 220","marko.r@example.com","markor","polznica","zapadlo",true),
    mk("Nejc Lotric","2. liga","051 110 770","nejc.l@example.com","nejcl","polznica","placano",false),
    // 3. liga
    mk("Jaka Mur","3. liga","040 220 110","jaka.m@example.com","jakam","polznica","placano",true),
    mk("Iztok Rodic","3. liga","031 330 880","iztok.r@example.com","iztokr","lokacija","cakanje",false),
    mk("Gregor Vavdi","3. liga","041 990 110","gregor.v@example.com","gregorv","polznica","placano",true),
    mk("Mark Kuhar","3. liga","051 440 330","mark.k@example.com","markk","polznica","cakanje",false),
    // 4. B liga
    mk("Timon Grabovac","4. B liga","040 110 550","timon.g@example.com","timong","polznica","placano",true),
    mk("Boris Zorko","4. B liga","031 220 660","boris.z@example.com","borisz","lokacija","placano",false),
    mk("Leon Emersic","4. B liga","041 330 220","leon.e@example.com","leone","polznica","zapadlo",true),
    mk("David Vajnhandl","4. B liga","051 770 110","david.v@example.com","davidv","polznica","cakanje",false),
  ],
  // predlagane tekme za ta vikend
  matches: [
    m("4. A liga","Toni Jukic","Filip Dolenc","Sob 31.10","pop (13-17)","Igrisce 3",{a:false,b:false}),
    m("4. A liga","Jure Trupej","Rok Salamija","Pet 30.10","vecer (17-21)","Igrisce 1",{a:true,b:true}),
    m("4. A liga","Gal Novak","Andraz Starc","Ned 1.11","dop (9-13)","Igrisce 2",{a:true,b:false}),
    m("1. liga","Luka Cernuta","Uros Samec","Sob 31.10","dop (9-13)","Igrisce 1",{a:true,b:true}),
    m("1. liga","Danijel Josic","Jan Hocevar","Ned 1.11","pop (13-17)","Igrisce 4",{a:false,b:false}),
    m("2. liga","Ziga Pucko","Klemen Lahovec","Sob 31.10","vecer (17-21)","Igrisce 2",{a:true,b:false}),
    m("2. liga","Marko Rabuza","Nejc Lotric","Pet 30.10","pop (13-17)","Igrisce 3",{a:false,b:false}),
    m("3. liga","Jaka Mur","Iztok Rodic","Ned 1.11","dop (9-13)","Igrisce 1",{a:true,b:true}),
    m("3. liga","Gregor Vavdi","Mark Kuhar","Sob 31.10","pop (13-17)","Igrisce 4",{a:true,b:false}),
    m("4. B liga","Timon Grabovac","Boris Zorko","Pet 30.10","vecer (17-21)","Igrisce 2",{a:true,b:true}),
  ],
  // razpolozljivost: player -> [slotIndex]
  availability: {
    "Toni Jukic":[3,4,6,7,8],    // sobota + nedelja
    "Filip Dolenc":[4],
    "Gal Novak":[6],
    "David Vajnhandl":[1,4,7],   // na voljo, a nesparjen
    "Leon Emersic":[3,6],        // na voljo, a nesparjen
    "Mark Kuhar":[4,5],
    "Rok Salamija":[2],
  },
  // odigrane tekme (prejsnji krog) -> lestvice
  results: [
    r("4. A liga","Jure Trupej","Toni Jukic","6:3, 4:6, 6:2"),
    r("4. A liga","Filip Dolenc","Andraz Starc","6:1, 6:4"),
    r("4. A liga","Gal Novak","Rok Salamija","7:5, 6:3"),
    r("1. liga","Luka Cernuta","Jan Hocevar","6:2, 6:2"),
    r("1. liga","Uros Samec","Danijel Josic","4:6, 6:3, 7:5"),
    r("2. liga","Ziga Pucko","Marko Rabuza","6:4, 6:4"),
    r("3. liga","Jaka Mur","Gregor Vavdi","6:0, 6:3"),
    r("4. B liga","Timon Grabovac","Leon Emersic","6:4, 3:6, 6:4"),
  ],
};
function mk(name,league,phone,email,delpa,pay,status,ball){
  return {name,league,phone,email,delpa,payMethod:pay,payStatus:status,homeHost:ball,
          ballsReady:ball?Math.random()>.4:false};
}
function m(league,a,b,day,time,court,conf){
  const slot=DAYS.indexOf(day)*3+TIMES.indexOf(time);
  return {id:cryptoId(),league,a,b,day,time,court,slot,conf:{...conf},forfeit:false};
}
function r(league,winner,loser,score){return {league,winner,loser,score};}
function cryptoId(){return 'm'+Math.random().toString(36).slice(2,9);}

/* ---- state / persistence ---- */
const KEY="liga_proto_v1";
let DB = load();
function load(){
  try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}
  // deep copy seed (functions already executed)
  return JSON.parse(JSON.stringify(SEED));
}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function resetDB(){localStorage.removeItem(KEY);DB=JSON.parse(JSON.stringify(SEED));CURRENT="__admin__";render();flash("Demo ponastavljen");}

let CURRENT="__admin__"; // "__admin__" = Anze, sicer ime igralca
function isAdmin(){return CURRENT==="__admin__";}
function me(){return isAdmin()?null:DB.players.find(p=>p.name===CURRENT);}

/* ---- helpers ---- */
function flash(msg){const f=document.getElementById('flash');f.textContent=msg;f.classList.add('show');
  clearTimeout(f._t);f._t=setTimeout(()=>f.classList.remove('show'),1900);}
function initials(n){return n.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase();}
function matchState(mt){
  if(mt.forfeit) return "forfeit";
  if(mt.conf.a&&mt.conf.b) return "confirmed";
  return "open";
}
function payPill(s){
  if(s==="placano") return '<span class="pill p-green">placano</span>';
  if(s==="cakanje") return '<span class="pill p-amber">caka plac.</span>';
  return '<span class="pill p-red">zapadlo</span>';
}

/* ---- navigation ---- */
const TABS=[
  {id:"dash",   ic:"▦", label:"Nadzorna plosca", admin:true, player:true},
  {id:"razpored",ic:"\u{1F4C5}",label:"Razpored",       admin:true, player:true},
  {id:"navoljo",ic:"\u{1F3BE}",label:"Prosti termini",  admin:true, player:true},
  {id:"razpol", ic:"✓", label:"Razpolozljivost",  admin:true, player:true},
  {id:"lestvice",ic:"\u{1F3C6}",label:"Lestvice",        admin:true, player:true},
  {id:"placila",ic:"€", label:"Placila",          admin:true, player:true},
  {id:"igralci",ic:"\u{1F465}",label:"Igralci",          admin:true, player:false},
];
let ACTIVE="dash";

function buildUserSelect(){
  const sel=document.getElementById('userSel');
  let html='<option value="__admin__">Anze (organizator)</option>';
  DB.players.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>{
    html+=`<option value="${p.name}">${p.name} - ${p.league}</option>`;
  });
  sel.innerHTML=html; sel.value=CURRENT;
}
function setUser(v){CURRENT=v;if(!TABS.find(t=>t.id===ACTIVE)[ (isAdmin()?'admin':'player') ]) ACTIVE="dash";render();}

function render(){
  document.getElementById('roleBadge').textContent=isAdmin()?"organizator":"igralec";
  buildUserSelect();
  // nav
  const openCount = pendingForUserCount();
  const nav=document.getElementById('nav');
  nav.innerHTML=TABS.filter(t=>isAdmin()?t.admin:t.player).map(t=>{
    const badge=(t.id==="razpored"&&openCount>0)?`<span class="count">${openCount}</span>`:"";
    return `<button class="${t.id===ACTIVE?'active':''}" onclick="go('${t.id}')"><span class="ic">${t.ic}</span>${t.label}${badge}</button>`;
  }).join("");
  // main
  document.getElementById('main').innerHTML = VIEWS[ACTIVE]();
}
function go(id){ACTIVE=id;render();window.scrollTo({top:0,behavior:'smooth'});}

function pendingForUserCount(){
  // za igralca: tekme kjer se ni potrdil; za admin: tekme ki niso potrjene
  if(isAdmin()) return DB.matches.filter(mt=>matchState(mt)==="open").length;
  const n=CURRENT;
  return DB.matches.filter(mt=>(mt.a===n||mt.b===n)&&!mt.forfeit&&!( (mt.a===n&&mt.conf.a)||(mt.b===n&&mt.conf.b) )).length;
}

/* =========================  VIEWS  ========================= */
const VIEWS={};

/* ---- Dashboard ---- */
VIEWS.dash=function(){
  const total=DB.matches.length;
  const confirmed=DB.matches.filter(mt=>matchState(mt)==="confirmed").length;
  const open=DB.matches.filter(mt=>matchState(mt)==="open").length;
  const forfeit=DB.matches.filter(mt=>mt.forfeit).length;
  const responded=new Set();
  DB.matches.forEach(mt=>{if(mt.conf.a)responded.add(mt.a);if(mt.conf.b)responded.add(mt.b);});
  const inMatches=new Set();DB.matches.forEach(mt=>{inMatches.add(mt.a);inMatches.add(mt.b);});
  const respRate=inMatches.size?Math.round(responded.size/ (inMatches.size)*100):0;
  const avail=Object.keys(DB.availability).length;
  const unpaid=DB.players.filter(p=>p.payStatus!=="placano").length;

  if(isAdmin()){
    // kdo se se ni odzval (je v razporedu, ni potrdil)
    const noResp=[];
    DB.matches.forEach(mt=>{
      if(mt.forfeit)return;
      if(!mt.conf.a)noResp.push(mt.a); if(!mt.conf.b)noResp.push(mt.b);
    });
    const noRespU=[...new Set(noResp)];
    return `
    <h1>Nadzorna plosca</h1>
    <p class="lead">Igralni vikend <b>${WEEKEND}</b> - pogled organizatorja</p>
    <div class="row">
      <div class="kpi"><div class="n">${total}</div><div class="l">tekem v predlogu</div></div>
      <div class="kpi good"><div class="n">${confirmed}</div><div class="l">potrjenih (oba)</div></div>
      <div class="kpi warn"><div class="n">${open}</div><div class="l">caka potrditev</div></div>

      <div class="kpi ${myOpen.length?'warn':'good'}"><div class="n">${myOpen.length}</div><div class="l">caka tvojo potrditev</div></div>

/* ---- Razpored ---- */
VIEWS.razpored=function(){
  const header=`<h1>Razpored tekem</h1><p class="lead">Igralni vikend <b>${WEEKEND}</b>. Potrjene tekme so zelene. Koncni razpored: cetrtek do 14:00.</p>`;
  let leagueFilter = window._lf || (isAdmin()?"vse":me().league);
  const filter = `<div class="filterbar">
     <select onchange="window._lf=this.value;render()">
       <option value="vse" ${leagueFilter==='vse'?'selected':''}>Vse lige</option>
       ${LEAGUES.map(l=>`<option ${leagueFilter===l?'selected':''}>${l}</option>`).join("")}
     </select>
     <span class="muted" style="align-self:center;font-size:13px">Klikni na svojo tekmo za potrditev.</span>
   </div>`;
  let body="";
  const leaguesToShow = leagueFilter==="vse"?LEAGUES:[leagueFilter];
  leaguesToShow.forEach(lg=>{
    const ms=DB.matches.filter(mt=>mt.league===lg);
    if(!ms.length)return;
    body+=`<div class="sec-head"><h2>${lg} <span class="muted" style="font-weight:400;font-size:13px">- ${ms.length} tekem</span></h2></div>`;
    body+=`<div class="matches">${ms.map(renderMatch).join("")}</div>`;
  });
  return header+filter+body;
};

function renderMatch(mt){
  const st=matchState(mt);
  const meName=isAdmin()?null:CURRENT;
  const iAmA = meName===mt.a, iAmB = meName===mt.b, mine=iAmA||iAmB;
  function confChip(ok,declined){
    if(declined) return '<span class="chip-conf c-no">ne more</span>';
    return ok?'<span class="chip-conf c-yes">potrdil</span>':'<span class="chip-conf c-wait">caka</span>';
  }
  const stTag = st==="confirmed"?'<span class="pill p-green">POTRJENO</span>'
    : st==="forfeit"?'<span class="pill p-red">PREDAJA</span>'
    : '<span class="pill p-amber">caka potrditev</span>';
  let actions="";
  if(!mt.forfeit){
    if(isAdmin()){
      actions=`<div class="actions">
        ${st!=="confirmed"?`<button class="btn ok sm" onclick="adminConfirm('${mt.id}')">Oznaci kot potrjeno</button>`:''}
        <button class="btn danger sm" onclick="markForfeit('${mt.id}')">Predaja</button>
      </div>`;
    } else if(mine){
      const myOk = iAmA?mt.conf.a:mt.conf.b;
      actions=`<div class="actions">
        ${!myOk?`<button class="btn ok sm" onclick="confirmMatch('${mt.id}')">Potrdi termin</button>`:`<button class="btn ghost sm" onclick="unconfirmMatch('${mt.id}')">Preklici potrditev</button>`}
        <button class="btn danger sm" onclick="declineMatch('${mt.id}')">Ne morem igrati</button>
      </div>`;
    }
  }
  return `<div class="match ${st}">
    <div class="slot"><span class="lg-tag">${mt.league}</span> <span>📅 ${mt.day}</span> <span>${mt.time}</span> <span>📍 ${mt.court}</span></div>
    <div class="vs">
      <div class="pl ${iAmA?'me':''}"><span class="nm">${mt.a}</span>${confChip(mt.conf.a,mt._declA)}</div>
      <div class="x">vs</div>
      <div class="pl ${iAmB?'me':''}" style="text-align:right;align-items:flex-end"><span class="nm">${mt.b}</span>${confChip(mt.conf.b,mt._declB)}</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center">${stTag}${actions}</div>
  </div>`;
}

function confirmMatch(id){const mt=DB.matches.find(x=>x.id===id);if(CURRENT===mt.a){mt.conf.a=true;mt._declA=false;}else{mt.conf.b=true;mt._declB=false;}save();render();
  flash(matchState(mt)==="confirmed"?"Tekma potrjena - oba igralca! ✅":"Tvoja potrditev zabelezena");}
function unconfirmMatch(id){const mt=DB.matches.find(x=>x.id===id);if(CURRENT===mt.a)mt.conf.a=false;else mt.conf.b=false;save();render();flash("Potrditev preklicana");}
function declineMatch(id){const mt=DB.matches.find(x=>x.id===id);if(CURRENT===mt.a){mt.conf.a=false;mt._declA=true;}else{mt.conf.b=false;mt._declB=true;}save();render();flash("Zabelezeno: ne mores igrati. Termin se sprosti.");}
function adminConfirm(id){const mt=DB.matches.find(x=>x.id===id);mt.conf.a=true;mt.conf.b=true;mt._declA=mt._declB=false;save();render();flash("Tekma oznacena kot potrjena");}
function markForfeit(id){const mt=DB.matches.find(x=>x.id===id);mt.forfeit=!mt.forfeit;save();render();flash(mt.forfeit?"Zabelezeno kot predaja":"Predaja preklicana");}

/* ---- Prosti termini / Na voljo ---- */
function unmatchedAvailable(){
  const inMatch=new Set();DB.matches.forEach(mt=>{if(!mt.forfeit){inMatch.add(mt.a);inMatch.add(mt.b);}});
  return Object.keys(DB.availability).filter(n=>!inMatch.has(n));
}
VIEWS.navoljo=function(){
  const list=unmatchedAvailable();
  const meP=me();
  const header=`<h1>Prosti termini - kdo lahko igra?</h1>
    <p class="lead">Igralci, ki so oddali razpolozljivost in se nimajo nasprotnika. ${isAdmin()?'Povabi dva igralca na tekmo.':'Povabi nasprotnika iz svoje lige na tekmo.'}</p>`;
  if(!list.length) return header+`<div class="card"><div class="muted">Trenutno ni prostih nesparjenih igralcev. Vsi oddani so razporejeni.</div></div>`;
  const cards=list.map(n=>{
    const p=DB.players.find(x=>x.name===n);
    const slots=DB.availability[n].map(i=>SLOT_LABELS[i]).join(" &middot; ");
    let btn="";
    if(isAdmin()){
      btn=`<button class="btn primary sm" onclick="openPair('${n}')">Sparij z ...</button>`;
    } else if(meP && p.league===meP.league && n!==meP.name){
      // je ze med nama odigrana tekma?
      btn=`<button class="btn primary sm" onclick="invite('${n}')">Povabi na tekmo</button>`;
    } else if(meP && n===meP.name){
      btn=`<span class="pill p-blue">to si ti</span>`;
    } else {
      btn=`<span class="pill p-gray">druga liga</span>`;
    }
    return `<div class="avail-card">
      <div class="avatar">${initials(n)}</div>
      <div style="flex:1">
        <div style="font-weight:700">${n} <span class="lg-tag">${p.league}</span></div>
        <div class="muted" style="font-size:12.5px">Na voljo: ${slots}</div>
      </div>
      ${btn}
    </div>`;
  }).join("");
  // pairing panel (admin)
  let pair="";
  if(isAdmin()&&window._pairWith){
    const partner=window._pairWith;const pp=DB.players.find(x=>x.name===partner);
    const cands=list.filter(n=>n!==partner && DB.players.find(x=>x.name===n).league===pp.league);
    pair=`<div class="card" style="border-color:var(--clay)"><h3>Sparij: ${partner} (${pp.league}) z ...</h3>
      ${cands.length?cands.map(n=>`<button class="btn ghost sm" style="margin:0 6px 6px 0" onclick="doPair('${partner}','${n}')">${n}</button>`).join(""):'<span class="muted">Ni drugega prostega igralca v tej ligi.</span>'}
      <div style="margin-top:8px"><button class="btn ghost sm" onclick="window._pairWith=null;render()">Preklici</button></div></div>`;
  }
  return header+pair+`<div class="card">${cards}</div>`;
};
function openPair(n){window._pairWith=n;render();}
function doPair(a,b){
  const pa=DB.players.find(x=>x.name===a);
  // najdi skupni slot
  const sa=DB.availability[a]||[],sb=DB.availability[b]||[];
  const common=sa.find(s=>sb.includes(s));
  const slot=common!=null?common:(sa[0]!=null?sa[0]:0);
  const nm=newMatchFromSlot(pa.league,a,b,slot);
  DB.matches.push(nm);window._pairWith=null;save();render();go('razpored');
  flash(`Tekma ustvarjena: ${a} vs ${b}`);
}
function invite(opponent){
  const p=me();
  const sp=DB.availability[p.name]||[], so=DB.availability[opponent]||[];
  const common=sp.find(s=>so.includes(s));
  const slot=common!=null?common:(so[0]!=null?so[0]:0);
  const nm=newMatchFromSlot(p.league,p.name,opponent,slot);
  // povabnik samodejno potrjen
  nm.conf.a=true;
  DB.matches.push(nm);save();render();go('razpored');
  flash(`Povabilo poslano ${opponent}. Tekma je v razporedu (caka njegovo potrditev).`);
}
function newMatchFromSlot(league,a,b,slot){
  const day=DAYS[Math.floor(slot/3)], time=TIMES[slot%3];
  return {id:cryptoId(),league,a,b,day,time,court:"se doloci",slot,conf:{a:false,b:false},forfeit:false,_new:true};
}

/* ---- Razpolozljivost ---- */
VIEWS.razpol=function(){
  if(isAdmin()){
    // matrika: igralec x slot
    const names=DB.players.map(p=>p.name).filter(n=>DB.availability[n]);
    const header=`<h1>Oddane razpolozljivosti</h1><p class="lead">Namesto Google obrazca - vse na enem mestu. ${Object.keys(DB.availability).length} oddanih za vikend ${WEEKEND}.</p>`;
    let rows=`<div class="avgrid"><div></div>${SLOT_LABELS.map((s,i)=>`<div class="hd">${DAYS[Math.floor(i/3)].split(" ")[0]}<br>${TIMES[i%3].split(" ")[0]}</div>`).join("")}</div>`;
    Object.keys(DB.availability).sort().forEach(n=>{

      rows+=`<div class="avgrid" style="margin-top:6px"><div style="font-weight:600;font-size:12.5px">${n}</div>`+
        SLOT_LABELS.map((s,i)=>`<div class="slotbtn ${set.has(i)?'on':''}" style="cursor:default">${set.has(i)?'✓':''}</div>`).join("")+`</div>`;
    });
    return header+`<div class="card" style="overflow-x:auto">${rows}</div>
      <details class="help"><summary>Zakaj to nadomesti Google obrazec</summary><div>Obrazec zbere odgovore v surovo tabelo, ki jo moras rocno brati in prepisovati v razpored. Tukaj razpolozljivost takoj napaja generator razporeda in zavihek "Prosti termini" - brez prepisovanja.</div></details>`;
  }
  // player view - toggle slots
  const p=me(); const set=new Set(DB.availability[p.name]||[]);
  const header=`<h1>Moja razpolozljivost</h1><p class="lead">Oznaci, kdaj lahko igras naslednji vikend (${WEEKEND}). Rok: nedelja 12:00.</p>`;
  const grid=`<div class="avgrid">
     <div></div>${TIMES.map(t=>`<div class="hd" style="grid-column:span 1">${t}</div>`).join("").replace(/span 1/g,'span 1')}
   </div>`;
  // simpler: 3 days x 3 times grid
  let g=`<div style="display:grid;grid-template-columns:120px repeat(3,1fr);gap:8px;align-items:center">
     <div></div>${TIMES.map(t=>`<div class="hd">${t}</div>`).join("")}`;
  DAYS.forEach((d,di)=>{
    g+=`<div style="font-weight:700;font-size:13px">${d}</div>`;
    TIMES.forEach((t,ti)=>{const idx=di*3+ti;
      g+=`<div class="slotbtn ${set.has(idx)?'on':''}" onclick="toggleSlot(${idx})">${set.has(idx)?'na voljo':'-'}</div>`;});
  });
  g+=`</div>`;
  return header+`<div class="card">${g}
    <div style="margin-top:16px;display:flex;gap:10px;align-items:center">
      <button class="btn primary" onclick="flash('Razpolozljivost shranjena - organizator jo vidi takoj')">Shrani razpolozljivost</button>
      <span class="muted" style="font-size:13px">Ce nic ne oznacis, ste steti kot "na voljo kadarkoli".</span>
    </div></div>
    <details class="help"><summary>Namig</summary><div>Oznacene termine vidi organizator takoj (brez maila), hkrati pa se pojavis v zavihku "Prosti termini", kjer te lahko nasprotnik iz tvoje lige povabi na tekmo.</div></details>`;
};
function toggleSlot(idx){const p=me();const arr=DB.availability[p.name]||(DB.availability[p.name]=[]);
  const i=arr.indexOf(idx); if(i>=0)arr.splice(i,1); else arr.push(idx);
  if(!arr.length)delete DB.availability[p.name]; save();render();}

/* ---- Lestvice ---- */
VIEWS.lestvice=function(){
  const header=`<h1>Lestvice</h1><p class="lead">Samodejno iz vnesenih rezultatov. Zmaga = 2 tocki, poraz = 1 tocka (udelezba).</p>`;
  let body="";
  const lf = window._llf || (isAdmin()?"vse":me().league);
  body+=`<div class="filterbar"><select onchange="window._llf=this.value;render()">
     <option value="vse" ${lf==='vse'?'selected':''}>Vse lige</option>
     ${LEAGUES.map(l=>`<option ${lf===l?'selected':''}>${l}</option>`).join("")}</select></div>`;
  const leaguesToShow=lf==="vse"?LEAGUES:[lf];
  leaguesToShow.forEach(lg=>{
    const standings=computeStandings(lg);
    if(!standings.length)return;
    body+=`<div class="card"><h2>${lg}</h2><table>
      <tr><th style="width:32px">#</th><th>Igralec</th><th class="num">Odigr.</th><th class="num">Zmage</th><th class="num">Porazi</th><th class="num">Tocke</th></tr>
      ${standings.map((s,i)=>`<tr${me()&&s.name===me().name?' style="background:var(--green-l)"':''}>
        <td><b>${i+1}</b></td><td>${s.name}</td><td class="num">${s.played}</td>
        <td class="num">${s.wins}</td><td class="num">${s.losses}</td><td class="num"><b>${s.points}</b></td></tr>`).join("")}
    </table></div>`;
  });
  return header+body;
};
function computeStandings(lg){
  const tbl={};
  DB.players.filter(p=>p.league===lg).forEach(p=>tbl[p.name]={name:p.name,played:0,wins:0,losses:0,points:0});
  DB.results.filter(r=>r.league===lg).forEach(r=>{
    if(tbl[r.winner]){tbl[r.winner].played++;tbl[r.winner].wins++;tbl[r.winner].points+=2;}
    if(tbl[r.loser]){tbl[r.loser].played++;tbl[r.loser].losses++;tbl[r.loser].points+=1;}
  });
  return Object.values(tbl).sort((a,b)=>b.points-a.points||b.wins-a.wins||a.name.localeCompare(b.name));
};

  let list=DB.players.slice();
  if(lf!=="vse")list=list.filter(p=>p.league===lf);
  list.sort((a,b)=>a.league.localeCompare(b.league)||a.name.localeCompare(b.name));
  return `<h1>Igralci</h1><p class="lead">${DB.players.length} igralcev v ${LEAGUES.length} ligah. Nadomesti rocni seznam kontaktov in Delpa usklajevanje.</p>
   <div class="filterbar">
     <select onchange="window._gf=this.value;render()">
       <option value="vse" ${lf==='vse'?'selected':''}>Vse lige</option>
       ${LEAGUES.map(l=>`<option ${lf===l?'selected':''}>${l}</option>`).join("")}
     </select>
     <button class="btn ghost sm" style="margin-left:auto" onclick="flash('(demo) uvoz iz Delpa.app / CSV')">Uvozi iz Delpa</button>
   </div>
   <div class="card"><table>
     <tr><th>Igralec</th><th>Liga</th><th>Kontakt</th><th>Delpa</th><th>Placilo</th></tr>
     ${list.map(p=>`<tr>
       <td><b>${p.name}</b></td><td><span class="lg-tag">${p.league}</span></td>
       <td style="font-size:12.5px">${p.phone}<br><span class="muted">${p.email}</span></td>
       <td style="font-size:12.5px">@${p.delpa}</td>
       <td>${payPill(p.payStatus)}</td>
     </tr>`).join("")}
   </table></div>`;
};

/* ---- noga ---- */
function renderFoot(){
  const el=document.createElement('div');el.className='foot';el.innerHTML=
    `Liga Manager - <b>prototip</b> za Ljubljansko zimsko teniško ligo 2026/27 &middot; vsi podatki izmisljeni (demo)<br>
     Preklopi uporabnika zgoraj desno (organizator / posamezen igralec), da vidis oba pogleda. &middot;
     <a href="#" onclick="resetDB();return false">Ponastavi demo</a>`;
  document.querySelector('main').appendChild(el);
}

/* ---- boot ---- */
const _render=render;
render=function(){_render();renderFoot();};
render();
</script>
</body>
</html>
