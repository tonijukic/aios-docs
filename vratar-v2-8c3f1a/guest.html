<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vratar - vaše bivanje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f3f5f8;--card:#ffffff;--ink:#16202f;--muted:#6a7488;--line:#e2e7ef;--soft:#eef2f7;
 --accent:#1f3a5f;--accent-d:#132840;--grad1:#1b3350;--grad2:#2f6a9e;--gold:#c99a2e;--ok:#1f9d57;
 --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 10px 30px rgba(16,24,40,.10);
}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:40px}
  .wrap{max-width:540px;margin:0 auto;padding:0 14px}
  /* demo bar */
  .demobar{background:#15202b;color:#cdd7e0;font-size:12.5px}
  .demobar .in{max-width:540px;margin:0 auto;padding:7px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .demobar b{color:#fff}
  .demobar select{background:#1f2c3a;color:#e7edf2;border:1px solid #33424f;border-radius:8px;padding:4px 8px;font-family:inherit;font-size:12.5px}
  .demobar .sp{flex:1}
  /* header / hero */
  header.hero{background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;
    padding:20px 18px 20px;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;opacity:.95}
  .brand .key{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.18);border-radius:7px;font-size:13px}
  .hello{font-size:13px;opacity:.9;margin-top:14px}
  .apt{font-size:22px;font-weight:700;margin-top:2px;line-height:1.2}
  .stay{font-size:13.5px;opacity:.95;margin-top:6px}
  .stay b{font-weight:600}
  .statusrow{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}
  .spill{font-size:12px;font-weight:600;background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.28);padding:3px 10px;border-radius:999px}
  /* tabs */
  .tabsbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(16,32,48,.04)}
  .tabsbar .in{max-width:540px;margin:0 auto;display:flex;gap:4px;padding:7px 10px}
  .tabbtn{flex:1;appearance:none;border:none;background:none;font-family:inherit;font-size:12px;font-weight:600;
    color:var(--muted);padding:8px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
  .tabbtn .ti{font-size:18px;line-height:1}
  .tabbtn.on{color:var(--accent-d);background:var(--soft)}
  .tabbtn .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);position:absolute;margin:-3px 0 0 16px;display:none}
  .tabbtn.hasdot .dot{display:block}
  /* panels / cards */
  main{margin-top:12px}
  .panel{display:none}
  .panel.on{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 16px;margin:12px 0}
  .card h2{font-size:16px;margin:0 0 3px;display:flex;align-items:center;gap:9px}
  .card h2 .ic{width:28px;height:28px;flex:none;display:inline-flex;align-items:center;justify-content:center;
    background:var(--soft);border-radius:9px;font-size:15px}
  .card .lead{color:var(--muted);font-size:13px;margin:0 0 12px;padding-left:37px}
  .kv{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:700;letter-spacing:3px;color:var(--accent-d)}
  .btn{appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--ink);
    font-family:inherit;font-size:14px;font-weight:600;padding:11px 14px;border-radius:12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
  .btn:hover{border-color:#cfd8e0}
  .btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.p:hover{background:var(--accent-d);border-color:var(--accent-d)}
  .btn.full{width:100%}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
  .row2{display:flex;gap:10px;flex-wrap:wrap}
  .row2 .btn{flex:1}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s}
  .steps li{counter-increment:s;position:relative;padding:8px 0 8px 36px;border-top:1px solid var(--line);font-size:14.5px}
  .steps li:first-child{border-top:none}
  .steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;
    background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .photos{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:10px 0 0}
  .photos img{height:120px;border-radius:12px;flex:none;object-fit:cover;border:1px solid var(--line)}
  .reco{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
  .reco:first-of-type{border-top:none}
  .reco .em{width:38px;height:38px;flex:none;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:19px}
  .reco .nm{font-weight:600;font-size:14.5px}
  .reco .ds{color:var(--muted);font-size:12.5px;line-height:1.4}
  .reco .meta{color:var(--muted);font-size:11.5px;margin-top:2px}
  .reco a{color:var(--accent);font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap;align-self:center}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--gold);
    background:color-mix(in srgb,var(--gold) 14%,transparent);
    border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);
    border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;letter-spacing:.03em}
  .note{font-size:12px;color:var(--muted);background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
  .note b{color:var(--ink)}
  .consent{display:flex;gap:9px;align-items:flex-start;font-size:12.8px;color:var(--muted);margin:12px 0}
  .consent input{margin-top:3px;flex:none;width:17px;height:17px;accent-color:var(--accent)}
  .filebox{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--soft);transition:.15s}
  .filebox:hover{border-color:var(--accent);color:var(--accent-d)}
  .filebox input{display:none}
  .prev{margin-top:12px;display:none}
  .prev img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
  .ok{color:var(--ok);font-weight:600;font-size:13.5px;display:none;align-items:center;gap:7px;margin-top:10px}
  /* chat */
  .chat{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;padding:4px 0}
  .bub{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.4}
  .bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
  .bub.them{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bub .who{font-size:10.5px;opacity:.7;margin-bottom:2px;font-weight:600}
  .chatin{display:flex;gap:8px;margin-top:10px}
  .chatin input{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:14px}
  .chatin input:focus{outline:none;border-color:var(--accent)}
  .faq details{border-top:1px solid var(--line);padding:10px 0}
  .faq details:first-of-type{border-top:none}
  .faq summary{font-weight:600;font-size:14.5px;cursor:pointer;list-style:none}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::before{content:"+";color:var(--accent);font-weight:700;margin-right:9px}
  .faq details[open] summary::before{content:"\2013"}
  .faq p{color:var(--muted);font-size:13.5px;margin:7px 0 0}
  footer{text-align:center;color:var(--muted);font-size:12px;margin:22px 0 0}
  /* login gate */
  #gate{position:fixed;inset:0;background:linear-gradient(140deg,var(--grad1),var(--grad2));z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
  #gate .box{background:#fff;border-radius:20px;max-width:380px;width:100%;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  #gate .brand2{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;color:var(--accent-d)}
  #gate .brand2 .key{width:28px;height:28px;background:var(--accent);color:#fff;border-radius:9px;display:inline-flex;align-items:center;justify-content:center}
  #gate h1{font-size:19px;margin:16px 0 4px}
  #gate p{color:var(--muted);font-size:13.5px;margin:0 0 16px}
  #gate label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  #gate input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:16px;margin:6px 0 4px}
  #gate input:focus{outline:none;border-color:var(--accent)}
  #gate .err{color:#c0392b;font-size:12.5px;min-height:16px;margin:2px 0 8px}
  #gate .demohint{font-size:11.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:12px;text-align:center}
  .themetag{position:fixed;left:10px;bottom:10px;z-index:40;background:rgba(21,32,43,.85);color:#fff;font-size:11px;padding:4px 9px;border-radius:999px;font-weight:600}
</style>
</head>

<!-- LOGIN GATE -->
<div id="gate">
  <div class="box">
    <div class="brand2"><span class="key">&#128273;</span> Vratar</div>
    <h1 id="gate-h">Dobrodošli</h1>
    <p id="gate-sub">Za vaše bivanje potrdite priimek nosilca rezervacije.</p>
    <label id="gate-lab">Priimek</label>
    <input id="gate-name" autocomplete="family-name" placeholder="Priimek">
    <div class="err" id="gate-err"></div>
    <button class="btn p full" id="gate-go">Vstopi</button>
    <div class="demohint" id="gate-hint"></div>
  </div>
</div>

<!-- DEMO BAR -->
<div class="demobar">
  <div class="in">

      <option value="en">EN</option>
      <option value="de">DE</option>
      <option value="hr">HR</option>
      <option value="it">IT</option>
    </select>
  </div>
</div>

<header class="hero">
  <div class="wrap">
    <div class="brand"><span class="key">&#128273;</span> Vratar</div>
    <div class="hello" id="h-hello"></div>
    <div class="apt" id="h-apt"></div>
    <div class="stay" id="h-stay"></div>
    <div class="statusrow" id="h-status"></div>
  </div>
</header>

<nav class="tabsbar"><div class="in" id="tabs"></div></nav>

<main class="wrap" id="main"></main>

<div class="themetag" id="themetag" style="display:none"></div>

let LANG="sl";
let CUR=null;
let TAB="in"; /* in | reg | disc | help */
const params=new URLSearchParams(location.search);

function resById(id){return RES.find(r=>r.id===id);}
function pick(){const q=params.get("r")||params.get("t");return resById(q)||RES[0];}
function fmt(dt){return dt.toLocaleDateString(LANG==="sl"?"sl-SI":"en-GB",{day:"numeric",month:"short"});}
function stayDates(r){const i=addD(r.inOff);const o=addD(r.inOff+r.nights);return{i,o};}
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
/* lokalizirana vsebina s fallbackom (vsebina stanovanj/krajev je sl/en; UI je v 5 jezikih) */
function L(o){if(o==null)return"";if(typeof o==="string")return o;return o[LANG]!=null?o[LANG]:(o.en!=null?o.en:(o.sl!=null?o.sl:Object.values(o)[0]));}

 const codeDay=r.inOff<=0;
 document.getElementById("main").innerHTML=`
  <div class="panel ${TAB==="in"?"on":""}" data-panel="in">
    ${secCode(t,a,codeDay)}${secHow(t,a)}${secAddr(t,a)}${secWifi(t,a)}
  </div>
  <div class="panel ${TAB==="reg"?"on":""}" data-panel="reg">
    ${secDoc(t)}
  </div>
  <div class="panel ${TAB==="disc"?"on":""}" data-panel="disc">
    ${secReco(t)}${secTodo(t)}
  </div>
  <div class="panel ${TAB==="help"?"on":""}" data-panel="help">
    ${secChat(t,r)}${secFaq(t,a)}
  </div>
  <footer>Vratar &middot; ${r.id} &middot; demo</footer>
 `;
 wireCard();
 renderChat();
}

function goTab(tab){
 TAB=tab;
 document.querySelectorAll(".tabbtn").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
 document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.dataset.panel===tab));
 window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- chat ---------- */
function chatKey(){return "vratar_chat_"+CUR.id;}
function loadChat(){try{return JSON.parse(localStorage.getItem(chatKey())||"null")||defaultChat();}catch(e){return defaultChat();}}
function defaultChat(){return [{who:"them",txt:LANG==="sl"?"Pozdravljeni in dobrodošli! Smo ekipa Vratar. Če kaj potrebujete, smo tu.":"Hello and welcome! We are the Vratar team. We are here if you need anything."}];}
function saveChat(m){try{localStorage.setItem(chatKey(),JSON.stringify(m));}catch(e){}}
function renderChat(){
 const box=document.getElementById("chat");if(!box)return;
 const msgs=loadChat();const t=T[LANG];
 box.innerHTML=msgs.map(m=>`<div class="bub ${m.who}"><div class="who">${m.who==="me"?t.you:t.team}</div>${esc(m.txt)}</div>`).join("");
 box.scrollTop=box.scrollHeight;
}
function sendChat(){
 const inp=document.getElementById("chat-in");const v=(inp.value||"").trim();if(!v)return;
 const msgs=loadChat();msgs.push({who:"me",txt:v});saveChat(msgs);inp.value="";renderChat();
 setTimeout(()=>{const m=loadChat();m.push({who:"them",txt:T[LANG].chat_auto});saveChat(m);renderChat();},900);
}

/* ---------- wire ---------- */
function wireCard(){
 document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
   const v=b.getAttribute("data-copy");
   (navigator.clipboard?navigator.clipboard.writeText(v):Promise.resolve()).finally(()=>{
     const old=b.textContent;b.textContent=T[LANG].copied;setTimeout(()=>b.textContent=old,1200);});
 }));
 const cs=document.getElementById("code-show");
 if(cs)cs.addEventListener("click",()=>{document.getElementById("code-val").style.display="block";cs.style.display="none";});
 const file=document.getElementById("doc-file"),cons=document.getElementById("doc-consent"),
       send=document.getElementById("doc-send"),prev=document.getElementById("doc-prev"),img=document.getElementById("doc-img");
 let hasFile=false;function sync(){if(send)send.disabled=!(hasFile&&cons.checked);}
 if(file)file.addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;hasFile=true;
   const url=URL.createObjectURL(f);img.src=url;prev.style.display="block";sync();});
 if(cons)cons.addEventListener("change",sync);
 if(send)send.addEventListener("click",()=>{document.getElementById("doc-ok").style.display="flex";send.disabled=true;send.style.display="none";});
 const ci=document.getElementById("chat-in"),cbtn=document.getElementById("chat-send");
 if(cbtn)cbtn.addEventListener("click",sendChat);
 if(ci)ci.addEventListener("keydown",e=>{if(e.key==="Enter")sendChat();});
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tabbtn");if(b)goTab(b.dataset.tab);});

/* ---------- login gate ---------- */
function setupGate(){
 const r=pick();CUR=r;
 LANG=params.get("lang")||langByCountry[r.country]||"sl";
 const g=T[LANG];
 document.getElementById("gate-h").textContent=g.welcome;
 document.getElementById("gate-sub").textContent=g.gate_sub;
 document.getElementById("gate-lab").textContent=g.gate_lab;
 document.getElementById("gate-go").textContent=g.gate_go;
 document.getElementById("gate-name").placeholder=g.gate_lab;
 document.getElementById("gate-hint").innerHTML=g.gate_hint_pre+"<b>"+esc(r.last)+"</b>";
 const go=()=>{const v=document.getElementById("gate-name").value.trim().toLowerCase();
   if(v===r.last.toLowerCase()){document.getElementById("gate").style.display="none";}
   else{document.getElementById("gate-err").textContent=g.gate_err;}};
 document.getElementById("gate-go").addEventListener("click",go);
 document.getElementById("gate-name").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
}

/* ---------- demo bar ---------- */
function setupDemoBar(){
 const gsel=document.getElementById("db-guest");
 gsel.innerHTML=RES.map(r=>`<option value="${r.id}">${r.first} ${r.last}</option>`).join("");
 gsel.value=CUR.id;
 gsel.addEventListener("change",()=>{CUR=resById(gsel.value);LANG=langByCountry[CUR.country]||"sl";
   document.getElementById("db-lang").value=LANG;TAB="in";render();});
 const lsel=document.getElementById("db-lang");lsel.value=LANG;
 lsel.addEventListener("change",()=>{LANG=lsel.value;render();});
 document.getElementById("db-txt").textContent=LANG==="sl"?"portal gosta":"guest portal";
 // theme tag (if THEME_NAME injected)
 if(window.THEME_NAME){const el=document.getElementById("themetag");el.style.display="block";el.textContent="tema: "+window.THEME_NAME;}
}

/* ---------- init ---------- */
setupGate();
setupDemoBar();
render();
</script>
</body>
</html>
